name: Temporary Filesystem Junk Ignore Update
on:
  push:
    branches: [primitives_redesign]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: primitives_redesign, fetch-depth: 0}
      - name: Add and verify missing filesystem metadata ignores
        shell: python
        run: |
          from pathlib import Path
          p=Path('.gitignore'); t=p.read_text(encoding='utf-8'); e={x.strip() for x in t.splitlines() if x.strip() and not x.lstrip().startswith('#')}
          g=[('# macOS',['*.DS_Store','.AppleDouble','.LSOverride','._*','.Spotlight-V100/','.Trashes/','.fseventsd/','.DocumentRevisions-V100/','.TemporaryItems/','.VolumeIcon.icns','.com.apple.timemachine.donotpresent','.AppleDB','.AppleDesktop','Network Trash Folder/','Temporary Items/','.apdisk']),('# Windows',['Thumbs.db','Thumbs.db:encryptable','ehthumbs.db','ehthumbs_vista.db','Desktop.ini','$RECYCLE.BIN/','System Volume Information/','*.stackdump']),('# Linux / freedesktop',['.directory','.Trash-*/','.nfs*','.fuse_hidden*'])]
          s=[]; r=[]
          for h,a in g:
              r+=a; m=[x for x in a if x not in e]
              if m: s.append(h+'\n'+'\n'.join(m))
          if s: p.write_text(t.rstrip()+'\n\n# Cross-platform filesystem metadata\n'+'\n\n'.join(s)+'\n',encoding='utf-8')
          lines={x.strip() for x in p.read_text(encoding='utf-8').splitlines()}; m=[x for x in r if x not in lines]; assert not m, m
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/primitives-redesign-fs-junk-ignore.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .github/workflows/primitives-redesign-fs-junk-ignore.yml && git commit -m 'chore: ignore cross-platform filesystem metadata' && git push origin HEAD:primitives_redesign
